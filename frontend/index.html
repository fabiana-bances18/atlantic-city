<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlantic City | Gestión de Clientes</title>

    <!-- Framework Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="encabezado">
        <div class="container">
            <h1>Atlantic City</h1>
            <p>Sistema de gestión de clientes</p>
        </div>
    </header>

    <main class="container py-4">

        <!-- Inicio de sesión -->
        <section id="seccionLogin" class="card tarjeta-login mx-auto">
            <div class="card-body">
                <h2 class="h4 mb-3">Iniciar sesión</h2>

                <form id="formLogin">
                    <div class="mb-3">
                        <label for="usuario" class="form-label">Usuario</label>
                        <input
                            type="text"
                            id="usuario"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="contrasena" class="form-label">Contraseña</label>
                        <input
                            type="password"
                            id="contrasena"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Ingresar
                    </button>
                </form>

                <p id="mensajeLogin" class="mensaje mt-3" role="status"></p>
            </div>
        </section>

        <!-- Gestión de clientes -->
        <section id="seccionClientes" class="d-none">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 class="h4 mb-0">Gestión de clientes</h2>
                <button id="btnCerrarSesion" class="btn btn-outline-secondary">
                    Cerrar sesión
                </button>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <h3 id="tituloFormulario" class="h5">Registrar cliente</h3>

                    <form id="formCliente">
                        <input type="hidden" id="idCliente">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="documento" class="form-label">
                                    Documento de identidad *
                                </label>
                                <input
                                    type="text"
                                    id="documento"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="col-md-6">
                                <label for="nombres" class="form-label">Nombres *</label>
                                <input
                                    type="text"
                                    id="nombres"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="col-md-6">
                                <label for="apellidos" class="form-label">Apellidos *</label>
                                <input
                                    type="text"
                                    id="apellidos"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="col-md-6">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="text" id="telefono" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" id="correo" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" id="direccion" class="form-control">
                            </div>
                        </div>

                        <div class="mt-3 d-flex gap-2 flex-wrap">
                            <button type="submit" id="btnGuardar" class="btn btn-primary">
                                Registrar cliente
                            </button>
                            <button type="button" id="btnCancelar" class="btn btn-secondary d-none">
                                Cancelar edición
                            </button>
                        </div>

                        <p id="mensajeCliente" class="mensaje mt-3" role="status"></p>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h3 class="h5">Clientes registrados</h3>

                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Documento</th>
                                    <th>Nombres</th>
                                    <th>Apellidos</th>
                                    <th>Teléfono</th>
                                    <th>Correo</th>
                                    <th>Dirección</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaClientes">
                                <tr>
                                    <td colspan="7" class="text-center">
                                        Inicia sesión para cargar los clientes.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
